[project]
name = "ztaf-registry"
version = "0.1.0"
description = "Zero-TAF registry reference: published mandates, agent entries, capability provenance, signed revocation status lists, CLI."
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ztaf_registry"]
